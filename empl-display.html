<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Payroll UI</title>
    <link rel="stylesheet" href="empl-style.css">
    <script src="empl-script.js"></script>
</head>
<body>

<header class="top-header">
    <div class="logo">
        <span class="logo-icon">👤</span>
        <div>
            <div class="logo-title">EMPLOYEE</div>
            <div class="logo-sub">PAYROLL</div>
        </div>
    </div>

</header>

<div class="main-container">

    <div class="toolbar">
        <h3>Employee Details</h3>

        <div class="toolbar-actions">
            <input type="text" placeholder="🔍 Search">
            <button class="add-btn" onclick="navtoaddemp()">+ Add User</button>
        </div>
    </div>

    <table class="emp-table">
        <thead>
            <tr>
                <th>NAME</th>
                <th>GENDER</th>
                <th>DEPARTMENT</th>
                <th>SALARY</th>
                <th>START DATE</th>
                <th>ACTIONS</th>
            </tr>
        </thead>

        <tbody>
           
    </table>

</div>

</body>
</html>
