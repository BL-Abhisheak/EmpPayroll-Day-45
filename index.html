<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMP PAYROLL</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header class="form-header">Employee Payroll Form</header>
    <div class="form-container">
        <form id="payrolldataform">
            <label>Name</label>
            <input type="text" id="ipname" >

            <div class="form-row">
                <label>Select profile picture: </label>
                <div class="profile-pics">
                    <label class="pfl"><input type="radio" name="profile" value="pic1.png"><img src="images/1491423.jpg"></label>
                    <label class="pfl"><input type="radio" name="profile" value="pic2.png"><img src="images/152516.jpg"></label>
                    <label class="pfl"><input type="radio" name="profile" value="pic3.png"><img src="images/820630.jpg"></label>
                    <label class="pfl"><input type="radio" name="profile" value="pic4.png"><img src="images/itachi-uchiha-3840x2160-19982.jpg"></label>
                 
                </div>
            </div>

            <div class="form-row">
                <label>Gender</label>
                <div class="gender-box">
                     <label class="gnd"><input type="radio" name="gender" value="Male">Male</label>
                     <label class="gnd"><input type="radio" name="gender" value="Female">Female</label>
                </div>
            </div>

            <div class="form-row">
                <label>Department</label>
                <div class="dept-box">
                     <label class="dept"><input type="checkbox" value="HR">HR</label>
                    <label class="dept"><input type="checkbox" value="Sales">Sales</label>
                    <label class="dept"><input type="checkbox" value="Finance">Finance</label>
                    <label class="dept"><input type="checkbox" value="Engineer">Engineer</label>
                </div>
            </div>



            <div class="form-row">
                <label for="salary">Salary: <span id="salary-output">40000</span></label>
                <input type="range" min="10000" max="100000" value="40000" id="salary">
            </div>

           <div class="form-row">
                <div class="date-row">
                    <label>Start Date:</label>
                    <select id="day">
                        <option>1</option><option>2</option><option>3</option>
                        <option>4</option><option>5</option><option>6</option>
                        <option>7</option><option>8</option><option>9</option>
                        <option>10</option><option>11</option><option>12</option>
                        <option>13</option><option>14</option><option>15</option>
                        <option>16</option><option>17</option><option>18</option>
                        <option>19</option><option>20</option><option>21</option>
                        <option>22</option><option>23</option><option>24</option>
                        <option>25</option><option>26</option><option>27</option>
                        <option>28</option><option>29</option><option>30</option>
                        <option>31</option>
                    </select>

                      <select id="month">
                        <option value="0">Jan</option>
                        <option value="1">Feb</option>
                        <option value="2">Mar</option>
                        <option value="3">Apr</option>
                        <option value="4">May</option>
                        <option value="5">Jun</option>
                        <option value="6">Jul</option>
                        <option value="7">Aug</option>
                        <option value="8">Sep</option>
                        <option value="9">Oct</option>
                        <option value="10">Nov</option>
                        <option value="11">Dec</option>
                    </select>

                    
                    <select id="year">
                        <option>2026</option><option>2025</option><option>2024</option><option>2023</option>
                    </select>
            </div>


            <div class="form-row">
                <label for="notes">Notes:</label>
                <textarea id="notes" rows="3"></textarea>
            </div>

             <div id="buttons" class="form-buttons">
                <button type="reset" id="resetBtn" class="btn">Reset</button>
                <button id="cancelBtn" class="btn" onclick="navtodisp()">Cancel</button>
                <button id="submitBtn" class="btn">Submit</button>
            </div>
            

            </div>
        </form>
    </div>
   
</body>
</html>
